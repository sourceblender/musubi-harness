name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by release-please.yml so nothing publishes from a red commit.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install package + dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff mypy pytest pytest-cov
          # Parity with the PyJWT Musubi runs (musubi pyproject: pyjwt>=2.13.0).
          pip install "pyjwt>=2.13.0"

      - name: ruff (lint)
        run: ruff check src tests

      - name: ruff (format check)
        run: ruff format --check src tests

      - name: mypy --strict
        run: mypy src

      # The server's own scope, identity and claim functions, for the parity
      # tests (scope, identity and claim parity). Only those pure functions are
      # extracted and exec'd; the package is never installed or imported.
      # Tracks Musubi main, so server drift fails here.
      - name: Musubi source for parity tests
        # Outside the workspace: the secret-pattern test scans this repo's text.
        run: git clone --depth 1 --quiet https://github.com/ericmey/musubi "$RUNNER_TEMP/musubi-src"

      - name: pytest
        env:
          MUSUBI_SOURCE_DIR: ${{ runner.temp }}/musubi-src
        run: pytest --cov=musubi_harness --cov-report=term-missing
